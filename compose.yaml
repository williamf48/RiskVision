services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: riskvision_dev
      POSTGRES_DB: risk_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d risk_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - riskvision_postgres:/var/lib/postgresql/data

volumes:
  riskvision_postgres:
